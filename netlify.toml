[build]
  command = "npm run build"
  publish = "dist"

# Canonical host: 301 from www to apex
[[redirects]]
  from = "https://www.evpay.co.tz/*"
  to = "https://evpay.co.tz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.evpay.co.tz/*"
  to = "https://evpay.co.tz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://evpay.co.tz/*"
  to = "https://evpay.co.tz/:splat"
  status = 301
  force = true

# Custom 404 page for any unknown path (static site, not a SPA)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Long-cache static assets (images, fonts, CSS, JS) — they're versioned by content
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always be revalidated
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security + SEO headers for every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Ensure plaintext content-types for crawler-facing files
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
